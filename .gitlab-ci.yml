workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH'

stages:
  - build

variables:
  GIT_DEPTH: "0"

configs:validate:
  image: "python:3.13-slim"
  stage: build
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends git
  script:
    - |
      python - <<'PY'
      import json
      from pathlib import Path

      root = Path(".")
      paths = sorted(root.glob("*.json"))
      paths.extend(sorted(root.glob("icon/*.json")))
      paths.extend(sorted(root.glob("_meta/*.json")))
      for path in paths:
          json.loads(path.read_text(encoding="utf-8-sig"))
      print(f"validated {len(paths)} json files")
      PY
    - python tools/build_index.py --check
  artifacts:
    name: "MiPushConfigurations-index-$CI_COMMIT_REF_SLUG"
    when: always
    expire_in: 14 days
    paths:
      - _meta/config-index.json

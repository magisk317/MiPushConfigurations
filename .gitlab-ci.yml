include:
  - project: magisk3171/shared/magisk-ci-toolkit
    ref: 269807205c7e55ee3bba36ae3519d32232296da7
    file: /.gitlab/ci/cancel-mr-pipelines.yml

workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH'

default:
  interruptible: true
  tags:
    - magisk-amd64-linux

stages:
  - build
  - sync

variables:
  GIT_DEPTH: "0"
  MAGISK_CI_TOOLKIT_REF: "269807205c7e55ee3bba36ae3519d32232296da7"
  MAGISK_TELEGRAM_PIN: "off"
  MAGISK_CANCEL_OLDER_MR_PIPELINES: "true"

configs:validate:
  image: "python:3.13-slim"
  stage: build
  before_script:
    - |
      set -euo pipefail
      sed -i \
        -e 's#http://deb.debian.org/debian-security#https://mirrors.tuna.tsinghua.edu.cn/debian-security#g' \
        -e 's#http://security.debian.org/debian-security#https://mirrors.tuna.tsinghua.edu.cn/debian-security#g' \
        -e 's#http://deb.debian.org/debian#https://mirrors.tuna.tsinghua.edu.cn/debian#g' \
        /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
    - apt-get update
    - apt-get install -y --no-install-recommends git
  script:
    - python tools/test_build_index.py
    - python tools/build_index.py --check
  artifacts:
    name: "MiPushConfigurations-index-$CI_COMMIT_REF_SLUG"
    when: always
    expire_in: 14 days
    paths:
      - _meta/config-index.json

cancel:older:mr:pipelines:
  extends: .magisk_cancel_older_mr_pipelines

sync:github:
  stage: sync
  needs: []
  image: alpine:latest
  tags:
    - magisk-arm64-linux
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_COMMIT_TAG'
    - when: never
  before_script:
    - apk add --no-cache git
  script:
    - |
      set -euo pipefail
      git remote add github "https://magisk317:${GITHUB_PAT}@github.com/magisk317/${CI_PROJECT_NAME}.git" || true
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        git push github "$CI_COMMIT_TAG" --force
        git push github --tags --force
      else
        git push github "HEAD:refs/heads/$CI_COMMIT_BRANCH" --force
      fi
